name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  KEYSTORE_PATH: app/release.jks
  KEYSTORE_PROPS_PATH: keystore.properties

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # v4 is required: v3 defaults to installing the retired "tools" package
      # and fails. v4 also accepts SDK licenses by default, and the runner
      # image already ships platform 36 and matching build-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Create placeholder so build.gradle.kts always finds it
      # (overwritten with real secrets on push)
      - name: Create placeholder keystore.properties
        run: |
          cat > "$KEYSTORE_PROPS_PATH" <<EOF
          storeFile = release.jks
          storePassword = placeholder
          keyPassword = placeholder
          keyAlias = placeholder
          EOF

      # Only on push: inject real signing secrets
      - name: Prepare release signing key
        if: github.event_name == 'push'
        env:
          STORE_PASS: ${{ secrets.MORA_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.MORA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MORA_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.MORA_KEYSTORE_BASE64 }}
        run: |
          base64 -d > "$KEYSTORE_PATH" <<< "$KEYSTORE_B64"
          cat > "$KEYSTORE_PROPS_PATH" <<EOF
          storeFile = release.jks
          storePassword = $STORE_PASS
          keyPassword = $KEY_PASS
          keyAlias = $KEY_ALIAS
          EOF

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: github.event_name == 'push'
        run: ./gradlew assembleRelease

      - name: Verify release APK signature
        if: github.event_name == 'push'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release APK
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Clean signing artifacts
        if: always()
        run: rm -f "$KEYSTORE_PATH" "$KEYSTORE_PROPS_PATH"
